name: WordCraft pinned upstream build

on:
  push:
    branches: [feature/wordcraft-wasm-govconnect]
    paths:
      - .github/workflows/wordcraft-build.yml
      - docs/wordcraft/upstream.lock.json
      - integrations/wordcraft/**
      - scripts/wordcraft_overlay.py
      - scripts/wordcraft_notices.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wordcraft-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      WORDCRAFT_NO_PREFS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned upstream revision
        id: pin
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          lock = json.load(open('docs/wordcraft/upstream.lock.json'))
          assert lock['repository'] == 'https://github.com/storytold/wordcraft'
          assert re.fullmatch('[0-9a-f]{40}', lock['commit'])
          assert type(lock['baseline_run']) is int and lock['baseline_run'] > 0
          assert type(lock['baseline_artifact_id']) is int and lock['baseline_artifact_id'] > 0
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"sha={lock['commit']}\n")
              out.write(f"baseline_run={lock['baseline_run']}\n")
              out.write(f"baseline_artifact={lock['baseline_artifact_id']}\n")
          PY
      - uses: actions/checkout@v4
        with:
          repository: storytold/wordcraft
          ref: ${{ steps.pin.outputs.sha }}
          path: work-upstream
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            work-upstream/target
          key: wordcraft-linux-rust199-${{ steps.pin.outputs.sha }}
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev libudev-dev libasound2-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev pkg-config
      - name: Install pinned Rust and wasm target
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default 1.99.0
          rustc --version
          cargo --version
      - name: Install checksum-verified Trunk 0.21.14
        run: |
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/trunk.tar.gz" https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b  $RUNNER_TEMP/trunk.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/trunk.tar.gz" -C "$HOME/.cargo/bin" trunk
          trunk --version
      - name: Fetch locked dependencies and record provenance
        working-directory: work-upstream
        env:
          EXPECTED_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p ../build-evidence
          git rev-parse HEAD > ../build-evidence/upstream-sha.txt
          sha256sum Cargo.lock > ../build-evidence/Cargo.lock.sha256
          cargo fetch --locked
          cargo metadata --locked --format-version 1 > ../build-evidence/cargo-metadata.json
          rustc --version > ../build-evidence/tools.txt
          cargo --version >> ../build-evidence/tools.txt
          trunk --version >> ../build-evidence/tools.txt
      - name: Verify upstream and embedded font notices
        run: |
          python3 scripts/wordcraft_notices.py --metadata build-evidence/cargo-metadata.json --upstream work-upstream --out build-evidence/notices > build-evidence/notices-check.json
      - name: Verify the approved immutable upstream baseline
        id: baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/runs/${{ steps.pin.outputs.baseline_run }} > build-evidence/baseline-run.json
          gh api repos/${{ github.repository }}/actions/artifacts/${{ steps.pin.outputs.baseline_artifact }}/zip > build-evidence/baseline-evidence.zip
          python3 scripts/wordcraft_preflight.py --source work-upstream --baseline-zip build-evidence/baseline-evidence.zip --run-metadata build-evidence/baseline-run.json > build-evidence/baseline-reuse.json
          echo "verified=true" >> "$GITHUB_OUTPUT"
      - name: Run upstream quality gates
        if: steps.baseline.outputs.verified != 'true'
        working-directory: work-upstream
        shell: bash
        run: |
          set -o pipefail
          cargo xtask ci 2>&1 | tee ../build-evidence/upstream-ci.log
      - name: Build upstream browser shell
        if: steps.baseline.outputs.verified != 'true'
        working-directory: work-upstream/apps/wordcraft-web
        shell: bash
        run: |
          set -o pipefail
          trunk build --release 2>&1 | tee ../../../build-evidence/trunk-build.log
      - name: Verify unchanged lock and measure assets
        if: steps.baseline.outputs.verified != 'true'
        working-directory: work-upstream
        run: |
          sha256sum --check ../build-evidence/Cargo.lock.sha256
          find dist/web -type f -printf '%s %p\n' | sort -nr > ../build-evidence/assets-size.txt
          find dist/web -type f -exec sha256sum {} + > ../build-evidence/assets-sha256.txt
          test -n "$(find dist/web -name '*.wasm' -print -quit)"
      - name: Cache the verified baseline before testing the integration
        if: steps.baseline.outputs.verified != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            work-upstream/target
          key: wordcraft-linux-rust199-${{ steps.pin.outputs.sha }}
      - name: Apply the isolated GovConnect adapter
        run: |
          python3 scripts/wordcraft_overlay.py --source work-upstream --browser > build-evidence/overlay.json
          rustfmt --edition 2024 --config-path integrations/wordcraft/rustfmt.toml work-upstream/apps/wordcraft-web/src/govconnect.rs work-upstream/apps/wordcraft-web/src/govconnect_browser.rs work-upstream/apps/wordcraft-web/src/main.rs
          cp work-upstream/apps/wordcraft-web/src/govconnect.rs build-evidence/govconnect-formatted.rs
      - name: Test the adapter against the real WordCraft engine
        working-directory: work-upstream
        shell: bash
        run: |
          set -o pipefail
          cargo fmt --all -- --check
          cargo test --locked -p wordcraft-web --lib 2>&1 | tee ../build-evidence/adapter-tests.log
          cargo test --locked -p wordcraft-ui-egui 2>&1 | tee ../build-evidence/adapter-ui-regression.log
          cargo clippy --locked -p wordcraft-web --all-targets -- -D warnings 2>&1 | tee ../build-evidence/adapter-clippy.log
          cargo check --locked -p wordcraft-web --target wasm32-unknown-unknown 2>&1 | tee ../build-evidence/adapter-wasm.log
          sha256sum --check ../build-evidence/Cargo.lock.sha256
      - name: Build the explicit GovConnect WASM API
        working-directory: work-upstream/apps/wordcraft-web
        shell: bash
        run: |
          set -o pipefail
          trunk build --release 2>&1 | tee ../../../build-evidence/govconnect-trunk.log
          grep -R -l 'GovConnectEditor' ../../dist/web/*.js > ../../../build-evidence/govconnect-api-exports.txt
          grep -R -l 'validate_checkpoint' ../../dist/web/*.js >> ../../../build-evidence/govconnect-api-exports.txt
          test -z "$(find ../../dist/web -name '*.ico' -print -quit)"
          if grep -E 'wordcraft\.ico|<title>WordCraft</title>|Loading WordCraft' ../../dist/web/index.html; then
            echo "Unmodified upstream brand shell remains in the integration build"
            exit 1
          fi
      - name: Assemble local integration test assets
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          root = pathlib.Path('work-upstream/dist/web')
          out = pathlib.Path('wordcraft-local-qa')
          out.mkdir()
          files = []
          for source in sorted(root.rglob('*')):
              if not source.is_file() or source.suffix not in {'.js', '.wasm'}:
                  continue
              relative = source.relative_to(root)
              target = out / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
              files.append({'path': str(relative), 'bytes': source.stat().st_size,
                            'sha256': hashlib.sha256(source.read_bytes()).hexdigest()})
          assert any(f['path'].endswith('.wasm') for f in files)
          assert any(f['path'].endswith('.js') for f in files)
          shutil.copytree('build-evidence/notices', out / 'notices')
          shutil.copyfile('build-evidence/cargo-metadata.json', out / 'cargo-metadata.json')
          pin = json.loads(pathlib.Path('docs/wordcraft/upstream.lock.json').read_text())
          (out / 'qa-manifest.json').write_text(json.dumps({
              'status': 'INTERNAL_LOCAL_QA_ONLY_NOT_DEPLOY_APPROVED',
              'upstream_commit': pin['commit'],
              'govconnect_commit': os.environ['GITHUB_SHA'],
              'distribution_review': 'Complete dependency obligations and runtime fidelity review remain pending',
              'files': files}, indent=2) + '\n')
          PY
      - name: Preserve assets for the local browser integration test
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-govconnect-local-qa
          path: wordcraft-local-qa/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve build evidence (no deploy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-upstream-build-evidence
          path: build-evidence/
          if-no-files-found: warn
          retention-days: 14

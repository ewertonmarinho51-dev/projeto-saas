# CI do GovDocs Wizard — roda a suíte de testes end-to-end (AppTest) a cada
# push/PR. Os testes usam o Modo Demonstração: não precisam de chave de API
# nem de acesso ao Supabase.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    # PostgreSQL descartável para o ENSAIO SQL.
    #
    # As provas de autorização — a matriz da 0020 e o isolamento das
    # tabelas de pesquisa de preços da 0021 — aplicam o schema real num
    # cluster local e exercem as políticas com o JWT injetado em
    # `request.jwt.claims`, que é o que o PostgREST faz. Sem o serviço
    # aqui, 93 provas de segurança PULAM em toda PR, e uma regressão de
    # RLS entraria sem ninguém ver.
    #
    # É um cluster efêmero do runner: as migrações `.NAO_APLICAR` são
    # aplicadas nele e em lugar nenhum mais — `exigir_dsn_local` recusa
    # DSN que não seja local, e recusa explicitamente qualquer DSN de
    # Supabase.
    # A imagem é `pgvector/pgvector`, não `postgres` puro, e isso não é
    # capricho: o schema real do projeto cria `public.vector(768)` e um
    # índice HNSW na base de conhecimento do GovBot. Com `postgres:16` o
    # ensaio morria em `create extension vector` — "extension \"vector\"
    # is not available" — e as 94 provas de autorização ERRAVAM em toda
    # PR desde a Fase 3. O portão se comportou como projetado: erro, não
    # silêncio. O que faltava era dar ao runner o mesmo PostgreSQL que o
    # schema exige, que é o que o Supabase de verdade oferece.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # `fetch-depth: 0` porque a varredura de segredos precisa do
      # intervalo BASE..HEAD, e com a profundidade 1 padrão não há base
      # para comparar — o `merge-base` falharia e a varredura seria
      # pulada calada, que é o pior dos mundos.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # VARREDURA DE SEGREDOS — primeiro passo, de propósito.
      #
      # O scanner existe desde a revisão externa e até agora dependia de
      # alguém lembrar de rodá-lo. Scanner que depende de memória não é
      # controle, é intenção. Aqui ele roda sozinho, antes dos 2,5 min de
      # suíte, para que um segredo em diff falhe em segundos.
      #
      # `--unified=0`, e esta linha é a correção de um portão que nasceu
      # quebrado. Na primeira versão o passo rodava o modo derivado, que
      # gera `git diff` com as 3 linhas de CONTEXTO padrão — e o contexto
      # entra na varredura. Resultado medido na própria PR que criou o
      # passo: ela falhou por causa da referência do projeto Supabase
      # que já estava no `CLAUDE.md` da main, duas linhas acima de uma
      # edição que não tinha nada a ver com ela.
      #
      # Um portão que reprova a PR por uma condição PREEXISTENTE na
      # vizinhança do que você editou é um portão que as pessoas
      # aprendem a contornar. A pergunta certa para um portão de PR é
      # "esta mudança INTRODUZ segredo?", e `--unified=0` com o filtro
      # de remoções do escopo árvore responde exatamente isso: sobram as
      # linhas ADICIONADAS.
      #
      # O preço, dito porque o próprio scanner o diz: em modo arquivo o
      # escopo é DECLARADO, não apurado por ele. Quem quiser o laudo com
      # procedência apurada sobre o estado final roda o modo derivado à
      # mão — está no cabeçalho de `scripts/varredura_segredos.py`.
      #
      # Sem base identificável a varredura FALHA. Não pula: "não consegui
      # verificar" e "verifiquei e está limpo" não podem ter a mesma cor.
      - name: Varredura de segredos (linhas adicionadas)
        env:
          BASE_DA_PR: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_DA_PR:-}" ]; then
            base="$BASE_DA_PR"
          else
            git fetch --no-tags origin main
            base="$(git merge-base origin/main HEAD)"
          fi
          if [ "$base" = "$(git rev-parse HEAD)" ]; then
            echo "HEAD é a própria base: nada de novo para varrer."
            exit 0
          fi
          echo "varrendo ${base}..$(git rev-parse HEAD)"
          mkdir -p /tmp/varredura
          git diff --unified=0 "$base"..HEAD > /tmp/varredura/mudanca.patch
          python3 scripts/varredura_segredos.py /tmp/varredura --escopo arvore

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: pnpm/action-setup@v4
        with:
          version: "11.19.0"

      - name: Verificar editor local e bundle versionado
        working-directory: assets/rich_editor
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm test
          pnpm build
          git diff --exit-code -- editor.bundle.js

      - name: Testar protocolo e lifecycle do host WordCraft
        run: node --test assets/wordcraft_editor/host.test.mjs assets/wordcraft_editor/validate.test.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # O PDF oficial nasce de DOCX → LibreOffice → PDF. Sem o Writer
      # nenhum filtro de documento carrega, export.motor_pdf() responde
      # 'fpdf2' e TODAS as provas do PDF real pulam — foi assim que os
      # 210 códigos da planilha saíram partidos no PDF sem ninguém ver.
      # `libreoffice-writer` puxa o core; é o mínimo para converter.
      - name: Instalar o motor institucional de PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      # `psycopg` é dependência de TESTE, não do app: fica fora de
      # requirements.txt para não embarcar um driver de Postgres no
      # deploy do Streamlit, que fala com o Supabase por HTTP. `pyyaml`
      # entra pela mesma porta — a prova que guarda a imagem do serviço
      # lê este arquivo como YAML, e ninguém mais no projeto depende
      # dele.
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pytest "psycopg[binary]" pyyaml

      # Os dois interruptores existem pela mesma razão: aqui a ausência
      # de um requisito é FALHA DE AMBIENTE, não skip. Instalar e subir
      # sem exigir deixaria a porta aberta para o silêncio voltar na
      # primeira vez que a instalação ou o serviço falhasse — e um
      # relatório cheio de "pulou" é indistinguível de um cheio de
      # "passou" para quem lê rápido.
      - name: Rodar testes
        env:
          GOVDOCS_EXIGIR_LIBREOFFICE: "1"
          GOVDOCS_EXIGIR_ENSAIO_SQL: "1"
          GOVDOCS_ENSAIO_PG_DSN: >-
            postgresql://postgres:postgres@localhost:5432/postgres
        run: python -m pytest -q

      - name: Provar contenção HTTP com PostgREST local
        env:
          GOVDOCS_ENSAIO_PG_DSN: >-
            postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/govconnect-http-bin"
          curl --fail --location --silent --show-error --retry 2 \
            --connect-timeout 15 --max-time 120 \
            https://github.com/PostgREST/postgrest/releases/download/v12.2.12/postgrest-v12.2.12-linux-static-x86-64.tar.xz \
            -o "$RUNNER_TEMP/govconnect-http-bin/postgrest.tar.xz"
          echo "5de4092f1719da3353c40bf96c8dec6913f2254a7cd0b61cc05f233153b557d5  $RUNNER_TEMP/govconnect-http-bin/postgrest.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/govconnect-http-bin/postgrest.tar.xz" \
            -C "$RUNNER_TEMP/govconnect-http-bin" postgrest
          python scripts/ensaio_http_local.py --dsn "$GOVDOCS_ENSAIO_PG_DSN" \
            --postgrest "$RUNNER_TEMP/govconnect-http-bin/postgrest" \
            --work-dir "$RUNNER_TEMP/govconnect-http"

      - name: Preservar prova HTTP local
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-containment-local
          path: ${{ runner.temp }}/govconnect-http/http.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Gerar referências sintéticas de fidelidade WordCraft
        if: github.ref == 'refs/heads/feature/wordcraft-wasm-govconnect'
        run: python scripts/wordcraft_corpus.py --out wordcraft-corpus --pdf

      - name: Preservar corpus sintético para inspeção visual
        if: github.ref == 'refs/heads/feature/wordcraft-wasm-govconnect' && success()
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-synthetic-fidelity-inputs
          path: wordcraft-corpus/
          retention-days: 14

  # API do Gov Conect (apps/api). Job PRÓPRIO, com as dependências
  # PRÓPRIAS: é o ambiente que prova que a API sobe sem o Streamlit
  # instalado. Rodá-la dentro do job acima, onde o Streamlit está, deixaria
  # a prova `test_sem_streamlit` sem o cenário que mais importa.
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Instalar dependências da API
        run: pip install -r requirements-dev.txt

      - name: Provar que o Streamlit não está neste ambiente
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('streamlit') is not None)"

      - name: Rodar testes da API
        run: python -m pytest -q

  # Autorização da API contra a pilha REAL descartável: PostgreSQL com o
  # schema do repositório, GoTrue oficial assinando ES256 (como produção)
  # e PostgREST. É aqui que tenant A × tenant B, revogação, edição
  # concorrente e idempotência são provados — os testes de `apps/api/tests`
  # só provam o que a API manda ao banco, não o que o banco faz.
  # Binários pinados pelos MESMOS SHA-256 do auth-real.yml.
  api-rls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # Broker da coleta assíncrona (P04c): o teste sobe um worker Celery
      # de verdade contra ele. Só na rede do runner.
      redis:
        image: redis:7.4-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Instalar dependências da API e do ensaio
        run: pip install -r apps/api/requirements-dev.txt "psycopg[binary]==3.3.6"

      - name: Baixar GoTrue e PostgREST pinados
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rls-bin"
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 120 \
            https://github.com/supabase/auth/releases/download/v2.197.0/auth-v2.197.0-amd64.tar.xz \
            -o "$RUNNER_TEMP/rls-bin/auth.tar.xz"
          echo "b5c2991d1df760c9b099c1c2395a94bd1c2f83ed58901934921997179dc9f7ea  $RUNNER_TEMP/rls-bin/auth.tar.xz" | sha256sum --check
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 120 \
            https://github.com/PostgREST/postgrest/releases/download/v12.2.12/postgrest-v12.2.12-linux-static-x86-64.tar.xz \
            -o "$RUNNER_TEMP/rls-bin/postgrest.tar.xz"
          echo "5de4092f1719da3353c40bf96c8dec6913f2254a7cd0b61cc05f233153b557d5  $RUNNER_TEMP/rls-bin/postgrest.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/rls-bin/postgrest.tar.xz" -C "$RUNNER_TEMP/rls-bin" postgrest

      - name: Provar autorização da API na pilha real
        working-directory: apps/api
        env:
          GOVCONECT_EXIGIR_RLS: "1"
          GOVCONECT_EXIGIR_REDIS: "1"
          REDIS_URL: redis://127.0.0.1:6379/0
          GOVCONECT_RLS_PG_DSN: "host=127.0.0.1 port=5432 dbname=postgres user=postgres password=postgres"
          GOVCONECT_GOTRUE_TAR: ${{ runner.temp }}/rls-bin/auth.tar.xz
          GOVCONECT_POSTGREST_BIN: ${{ runner.temp }}/rls-bin/postgrest
          PYTHONUTF8: "1"
        run: python -m pytest -q tests_rls

  # Web Next.js (apps/web): lint, tipos, provas de unidade, build e a
  # varredura do que vai ao navegador atrás de segredo.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build de produção
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo-ci.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: chave-publicavel-de-ci
        run: npm run build
      - name: Nenhum segredo no pacote do navegador
        run: npm run verificar-bundle

  # Login real e dados reais no navegador: a MESMA pilha descartável do
  # api-rls (Postgres + GoTrue ES256 + PostgREST), a API FastAPI e o web em
  # `next start`. Playwright entra com senha de verdade, cria, edita, vê o
  # conflito de versão, confere o isolamento entre municípios e sai.
  web-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [web]
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GOVCONECT_RLS_PG_DSN: "host=127.0.0.1 port=5432 dbname=postgres user=postgres password=postgres"
      GOVCONECT_GOTRUE_TAR: ${{ github.workspace }}/../rls-bin/auth.tar.xz
      GOVCONECT_POSTGREST_BIN: ${{ github.workspace }}/../rls-bin/postgrest
      GOVCONECT_E2E_ESTADO: ${{ github.workspace }}/../pilha-e2e.json
      PYTHONUTF8: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -r apps/api/requirements-dev.txt "psycopg[binary]==3.3.6"
      - name: Baixar GoTrue e PostgREST pinados
        shell: bash
        run: |
          set -euo pipefail
          d="$GITHUB_WORKSPACE/../rls-bin"; mkdir -p "$d"
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 120 \
            https://github.com/supabase/auth/releases/download/v2.197.0/auth-v2.197.0-amd64.tar.xz -o "$d/auth.tar.xz"
          echo "b5c2991d1df760c9b099c1c2395a94bd1c2f83ed58901934921997179dc9f7ea  $d/auth.tar.xz" | sha256sum --check
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 120 \
            https://github.com/PostgREST/postgrest/releases/download/v12.2.12/postgrest-v12.2.12-linux-static-x86-64.tar.xz -o "$d/postgrest.tar.xz"
          echo "5de4092f1719da3353c40bf96c8dec6913f2254a7cd0b61cc05f233153b557d5  $d/postgrest.tar.xz" | sha256sum --check
          tar -xJf "$d/postgrest.tar.xz" -C "$d" postgrest
      - name: Subir a pilha descartável
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          nohup python tests_rls/pilha.py --estado "$GOVCONECT_E2E_ESTADO" > "$RUNNER_TEMP/pilha.log" 2>&1 < /dev/null &
          for i in $(seq 1 120); do [ -s "$GOVCONECT_E2E_ESTADO" ] && break; sleep 1; done
          test -s "$GOVCONECT_E2E_ESTADO" || { tail -40 "$RUNNER_TEMP/pilha.log"; exit 1; }
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os
          e = json.load(open(os.environ["GOVCONECT_E2E_ESTADO"]))
          print("PILHA_URL=" + e["url"])
          print("PILHA_ANON=" + e["anon"])
          PY
      - name: Subir a API
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          APP_ENV=test SUPABASE_URL="$PILHA_URL" SUPABASE_KEY="$PILHA_ANON" PYTHONPATH=.:../.. \
            PRICE_RESEARCH_ENABLED=1 REDIS_URL=redis://127.0.0.1:6379/0 GOVCONECT_FONTES_COLETA=nenhuma \
            GOVCONECT_GOVERNANCA_ESCRITA=1 GOVCONECT_WORDCRAFT_WORKSPACE=1 \
            nohup python -m uvicorn govconect_api.asgi:app --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/api.log" 2>&1 < /dev/null &
          # Worker de verdade, sem fontes externas (só a pilha de teste aceita).
          APP_ENV=test SUPABASE_URL="$PILHA_URL" SUPABASE_KEY="$PILHA_ANON" PYTHONPATH=.:../.. \
            REDIS_URL=redis://127.0.0.1:6379/0 GOVCONECT_FONTES_COLETA=nenhuma \
            nohup python -m celery -A govconect_api.fila:celery worker --pool=solo \
            --concurrency=1 --loglevel=WARNING --without-gossip --without-mingle \
            > "$RUNNER_TEMP/worker.log" 2>&1 < /dev/null &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health/ready && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/health/ready
      - name: Build e subida do web
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          NEXT_PUBLIC_SUPABASE_URL="$PILHA_URL" NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$PILHA_ANON" npm run build
          GOVCONECT_API_URL=http://127.0.0.1:8000 GOVCONECT_SITE_URL=http://localhost:3000 \
            PRICE_RESEARCH_ENABLED=1 \
            nohup npx next start -p 3000 > "$RUNNER_TEMP/web.log" 2>&1 < /dev/null &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://localhost:3000/ && break; sleep 1; done
          curl -fs -o /dev/null http://localhost:3000/
      - name: Playwright
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Logs dos serviços (falha)
        if: failure()
        shell: bash
        run: tail -60 "$RUNNER_TEMP/pilha.log" "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/worker.log" "$RUNNER_TEMP/web.log" || true
      - name: Guardar capturas e relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-telas
          # Diretório SEM ponto: o upload-artifact v4 pula pasta oculta, e
          # com `warn` a primeira versão perdeu as capturas em silêncio.
          path: apps/web/e2e/resultados/
          if-no-files-found: error
          retention-days: 14

  # Imagens do Gov Conect 2.0 (P06): o que o VPS vai rodar, construído e
  # exercido a cada push — sem banco, sem segredo, sem tocar produção.
  # O compose é conferido nas DUAS formas: sem profile ele tem de
  # continuar sendo só o Streamlit + Caddy de hoje.
  imagens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compose sem profile continua igual ao de produção
        shell: bash
        run: |
          sudo mkdir -p /etc/govdocs
          sudo touch /etc/govdocs/env /etc/govdocs/caddy.env
          servicos="$(docker compose -f implantacao/docker-compose.yml config --services | sort | tr '\n' ' ')"
          echo "sem profile: $servicos"
          [ "$servicos" = "app caddy " ]
          sudo touch /etc/govdocs/api.env /etc/govdocs/web.env /etc/govdocs/redis.env
          servicos="$(docker compose -f implantacao/docker-compose.yml --profile govconect config --services | sort | tr '\n' ' ')"
          echo "com profile: $servicos"
          [ "$servicos" = "api app caddy redis web worker " ]
          # Nenhum serviço novo publica porta: só o Caddy.
          publicadas="$(docker compose -f implantacao/docker-compose.yml --profile govconect config --format json \
            | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; print(sorted(n for n,v in s.items() if v.get("ports")))')"
          echo "com porta publicada: $publicadas"
          [ "$publicadas" = "['caddy']" ]

      - name: Construir api e worker
        run: |
          docker build -f implantacao/Dockerfile.api --target api -t govconect-api:ci .
          docker build -f implantacao/Dockerfile.api --target worker -t govconect-worker:ci .

      - name: Construir web
        # Valores de TESTE: o build exige as duas NEXT_PUBLIC_* e recusa
        # chave de servidor. Nada aqui é credencial.
        run: |
          docker build -f implantacao/Dockerfile.web -t govconect-web:ci \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://exemplo-ci.supabase.invalid \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=chave-publicavel-de-teste .
          # Prefixo montado aqui: o literal no arquivo dispararia o varredor
          # de segredos do repositório.
          prefixo="sb_"; prefixo="${prefixo}secret_"
          if docker build -f implantacao/Dockerfile.web -t recusada:ci \
               --build-arg NEXT_PUBLIC_SUPABASE_URL=https://exemplo-ci.supabase.invalid \
               --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${prefixo}isto-nao-pode-entrar" . ; then
            echo "o build aceitou chave de servidor no bundle do navegador" >&2; exit 1
          fi

      - name: Smoke das imagens
        run: bash implantacao/smoke_imagens.sh govconect-api:ci govconect-worker:ci govconect-web:ci

      - name: Redis do compose exige senha
        # O MESMO comando do serviço `redis` do compose, lido do arquivo:
        # sem senha, PING é recusado; com ela, responde. Senha de TESTE,
        # gerada aqui.
        shell: bash
        run: |
          senha="$(openssl rand -hex 16)"
          printf 'REDIS_SENHA=%s\n' "$senha" | sudo tee /etc/govdocs/redis.env >/dev/null
          docker compose -f implantacao/docker-compose.yml --profile govconect up -d redis
          for i in $(seq 1 30); do
            [ "$(docker compose -f implantacao/docker-compose.yml ps redis --format '{{.Health}}')" = healthy ] && break
            sleep 1
          done
          docker compose -f implantacao/docker-compose.yml ps redis
          sem="$(docker compose -f implantacao/docker-compose.yml exec -T redis redis-cli ping 2>&1 || true)"
          echo "sem senha: $sem"
          echo "$sem" | grep -q NOAUTH
          com="$(docker compose -f implantacao/docker-compose.yml exec -T -e REDISCLI_AUTH="$senha" redis redis-cli ping)"
          [ "$com" = PONG ]
          docker compose -f implantacao/docker-compose.yml --profile govconect down

      - name: Promoção por SHA e rollback automático
        # `promover_govconect.sh` de verdade, contra um registro local: a
        # versão boa sobe healthy; a quebrada (web que nunca fica healthy)
        # é recusada e o script VOLTA SOZINHO para a anterior. Senhas e
        # valores de TESTE, gerados aqui.
        shell: bash
        run: |
          docker run -d -p 127.0.0.1:5000:5000 --name registro registry:2.8.3
          R=localhost:5000/govconect
          boa=sha-aaaaaaaaaaaa; ruim=sha-bbbbbbbbbbbb
          for v in "$boa" "$ruim"; do
            for n in api worker; do docker tag "govconect-$n:ci" "$R/govconect-$n:$v"; docker push -q "$R/govconect-$n:$v"; done
          done
          docker tag govconect-web:ci "$R/govconect-web:staging-$boa"
          docker push -q "$R/govconect-web:staging-$boa"
          printf 'FROM busybox:1.36.1\nHEALTHCHECK --interval=2s --retries=1 CMD false\nCMD ["sleep","3600"]\n' \
            | docker build -q -t "$R/govconect-web:staging-$ruim" -
          docker push -q "$R/govconect-web:staging-$ruim"

          senha="$(openssl rand -hex 16)"
          printf 'REDIS_SENHA=%s\n' "$senha" | sudo tee /etc/govdocs/redis.env >/dev/null
          printf 'APP_ENV=test\nREDIS_URL=redis://:%s@redis:6379/0\n' "$senha" | sudo tee /etc/govdocs/api.env >/dev/null
          printf 'GOVCONECT_API_URL=http://api:8000\n' | sudo tee /etc/govdocs/web.env >/dev/null
          export COMPOSE_DIR="$PWD/implantacao" ESTADO="$RUNNER_TEMP/imagens.env" REGISTRO="$R" LOG="$RUNNER_TEMP/promocoes.log"

          bash implantacao/promover_govconect.sh "$boa" staging
          grep -q "govconect-web:staging-$boa" "$ESTADO"

          if bash implantacao/promover_govconect.sh "$ruim" staging; then
            echo "o script aceitou uma versão que não fica healthy" >&2; exit 1
          fi
          echo "estado depois da recusa:"; cat "$ESTADO"
          grep -q "govconect-web:staging-$boa" "$ESTADO"
          # E o web da versão boa volta a ficar healthy de fato.
          for i in $(seq 1 45); do
            id="$(docker compose -f implantacao/docker-compose.yml --profile govconect ps -q web)"
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$id")" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.Config.Image}} {{.State.Health.Status}}' "$id" | tee /dev/stderr \
            | grep -q "govconect-web:staging-$boa healthy"
          cat "$LOG"
          docker compose -f implantacao/docker-compose.yml --profile govconect down

      - name: Caddy de convivência separa os caminhos no mesmo domínio
        # ADR-009: Streamlit e Next no mesmo govconect.com. O Caddy de
        # verdade, com o arquivo de verdade (só o endereço trocado por
        # :8080, sem TLS), diante de dois serviços falsos que dizem quem
        # são. `/app/static/*` tem de continuar no Streamlit (runtime do
        # WordCraft) e o DENY do Next não pode virar SAMEORIGIN.
        shell: bash
        run: |
          ACME_EMAIL=ci@example.invalid docker run --rm -e ACME_EMAIL \
            -v "$PWD/implantacao/Caddyfile.convivencia:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

          cat > "$RUNNER_TEMP/servico.py" <<'PY'
          import http.server, sys
          nome, porta = sys.argv[1], int(sys.argv[2])
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  if nome == "next":
                      self.send_header("X-Frame-Options", "DENY")
                  self.end_headers()
                  self.wfile.write(nome.encode())
              def log_message(self, *a):
                  pass
          http.server.HTTPServer(("0.0.0.0", porta), H).serve_forever()
          PY
          sed 's/^govconect.com, www.govconect.com {$/:8080 {/' implantacao/Caddyfile.convivencia > "$RUNNER_TEMP/Caddyfile"
          grep -q '^:8080 {' "$RUNNER_TEMP/Caddyfile"
          docker network create convivencia
          docker run -d --network convivencia --network-alias app -v "$RUNNER_TEMP/servico.py:/s.py:ro" python:3.11-alpine python /s.py streamlit 8501
          docker run -d --network convivencia --network-alias web -v "$RUNNER_TEMP/servico.py:/s.py:ro" python:3.11-alpine python /s.py next 3000
          docker run -d --network convivencia -p 127.0.0.1:18080:8080 -e ACME_EMAIL=ci@example.invalid \
            -v "$RUNNER_TEMP/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine
          for i in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:18080/ && break; sleep 1; done

          espera() {  # caminho quem
            veio="$(curl -fs "http://127.0.0.1:18080$1")"
            echo "$1 -> $veio"
            [ "$veio" = "$2" ] || { echo "ESPERADO $2" >&2; exit 1; }
          }
          espera / streamlit
          espera /_stcore/health streamlit
          espera /app/static/wordcraft/runtime.js streamlit
          espera /qualquer-pagina streamlit
          espera /entrar next
          espera /entrar/recuperar next
          espera /app next
          espera /app/precos/123 next
          espera /auth/confirmar next
          espera /privacidade next
          espera /_next/static/chunk.js next
          espera /logo-govconect.png next
          curl -fs -D - -o /dev/null http://127.0.0.1:18080/app | tr -d '\r' | grep -ix 'x-frame-options: DENY'
          ! curl -fs -D - -o /dev/null http://127.0.0.1:18080/app | grep -i 'sameorigin'
          curl -fs -D - -o /dev/null http://127.0.0.1:18080/ | tr -d '\r' | grep -ix 'x-frame-options: SAMEORIGIN'

name: WordCraft production release artifact

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wordcraft-release.yml
      - docs/wordcraft/runtime-source.lock.json
      - scripts/wordcraft_promote_artifact.py
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful WordCraft pinned upstream build run
        required: true
      fidelity_run_id:
        description: Successful matching WordCraft fidelity run
        required: true

permissions:
  contents: read
  actions: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch immutable run and artifact evidence
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BUILD_RUN: ${{ inputs.build_run_id }}
          INPUT_FIDELITY_RUN: ${{ inputs.fidelity_run_id }}
        run: |
          set -euo pipefail
          mkdir evidence input
          BUILD_RUN="${INPUT_BUILD_RUN:-$(jq -r .build_run_id docs/wordcraft/runtime-source.lock.json)}"
          FIDELITY_RUN="${INPUT_FIDELITY_RUN:-$(jq -r .fidelity_run_id docs/wordcraft/runtime-source.lock.json)}"
          [[ "$BUILD_RUN" =~ ^[0-9]+$ && "$FIDELITY_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN}" > evidence/build-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN}/artifacts" > evidence/build-artifacts.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FIDELITY_RUN}" > evidence/fidelity-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FIDELITY_RUN}/artifacts" > evidence/fidelity-artifacts.json
          build_artifact_id="$(jq -r .build_artifact_id docs/wordcraft/runtime-source.lock.json)"
          build_digest="sha256:$(jq -r .build_artifact_sha256 docs/wordcraft/runtime-source.lock.json)"
          fidelity_artifact_id="$(jq -r .fidelity_artifact_id docs/wordcraft/runtime-source.lock.json)"
          fidelity_digest="sha256:$(jq -r .fidelity_artifact_sha256 docs/wordcraft/runtime-source.lock.json)"
          jq -e --argjson id "$build_artifact_id" --arg digest "$build_digest" \
            '.artifacts | any(.id == $id and .digest == $digest and (.expired | not))' \
            evidence/build-artifacts.json >/dev/null
          jq -e --argjson id "$fidelity_artifact_id" --arg digest "$fidelity_digest" \
            '.artifacts | any(.id == $id and .digest == $digest and (.expired | not))' \
            evidence/fidelity-artifacts.json >/dev/null
          gh run download "$BUILD_RUN" -n wordcraft-govconnect-local-qa -D input
          test -f input/qa-manifest.json
          producer="$(jq -r .head_sha evidence/build-run.json)"
          test "$producer" = "$(jq -r .producer_commit docs/wordcraft/runtime-source.lock.json)"
          git merge-base --is-ancestor "$producer" "$GITHUB_SHA"
      - name: Promote only reconciled evidence
        run: |
          python3 scripts/wordcraft_promote_artifact.py \
            --bundle input \
            --build-run evidence/build-run.json \
            --build-artifacts evidence/build-artifacts.json \
            --fidelity-run evidence/fidelity-run.json \
            --fidelity-artifacts evidence/fidelity-artifacts.json \
            --fidelity-artifact-id "$(jq -r .fidelity_artifact_id docs/wordcraft/runtime-source.lock.json)" \
            --fidelity-artifact-digest "sha256:$(jq -r .fidelity_artifact_sha256 docs/wordcraft/runtime-source.lock.json)" \
            --approval-commit "$GITHUB_SHA" \
            --output release/wordcraft | tee evidence/promotion.json
          test "$(jq -r .status evidence/promotion.json)" = GOVCONNECT_WORDCRAFT_DEPLOY_APPROVED
          (cd release && zip -qr ../wordcraft-runtime.zip wordcraft)
          sha256sum release/wordcraft/qa-manifest.json wordcraft-runtime.zip > evidence/release-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wordcraft-production-runtime-${{ github.sha }}
          path: |
            wordcraft-runtime.zip
            evidence/
          if-no-files-found: error
          retention-days: 30

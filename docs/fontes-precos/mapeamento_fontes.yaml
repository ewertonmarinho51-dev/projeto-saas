# Mapeamento das fontes novas — preenchido com o ARQUIVO REAL de 20/10/2026.
# Substitui o modelo pendente do pacote (03_implementacao/02_MAPEAMENTO_FONTES.yaml).
# O que não foi conferido em dicionário/leiaute oficial está marcado PENDENTE.
version: 2
sources:
  TCE_RS:
    source_url: https://dados.tce.rs.gov.br/dados/licitacon/licitacao/ano/2026.csv.zip
    snapshot: {bytes: 258492699, sha256: 45ee32c12a9fb9427259b52d8015c2f6c706404f631796ae3eb1b3e287f4fce2,
               last_modified: "Tue, 20 Oct 2026 06:35:11 GMT", etag: '"6ad70b9f-f68491b"'}
    license: "não informada (CKAN license_id vazio, 20/10/2026)"
    archive_kind: zip_csv
    files: [documento_lic, dotacao_lic, evento_lic, item, item_prop, licitacao, licitante,
            lote, lote_prop, proposta, comissao, membrocons, memcomissao, pessoas]
    csv_dialect: {delimiter: ",", quoting: minimal}
    encoding: utf-8-sig
    number_format: ponto            # 9.14, 117.97, 70.00
    date_format: ISO                # 2026-02-04
    key_relationships:
      licitacao: [CD_ORGAO, NR_LICITACAO, ANO_LICITACAO, CD_TIPO_MODALIDADE]   # 128.806 linhas, 0 repetidas
      item: "licitacao + NR_LOTE + NR_ITEM"
      item_prop: "licitacao + NR_LOTE + NR_ITEM + TP_DOCUMENTO/NR_DOCUMENTO do proponente"
    field_map:
      descricao: item.DS_ITEM
      unidade: item.SG_UNIDADE_MEDIDA
      quantidade: item.QT_ITENS
      valor_unitario: item.VL_UNITARIO_HOMOLOGADO      # coluna própria; × QT_ITENS = VL_TOTAL_HOMOLOGADO em 100% das 452.295 linhas
      valor_total: item.VL_TOTAL_HOMOLOGADO
      valor_estimado: item.VL_UNITARIO_ESTIMADO        # guardado só como atributo, nunca como preço
      fornecedor: "item.TP_DOCUMENTO/NR_DOCUMENTO (1ª ocorrência; cabeçalho repete o nome) — só CNPJ (J)"
      orgao: licitacao.NM_ORGAO
      processo: licitacao.NR_PROCESSO
      data_resultado: licitacao.DT_HOMOLOGACAO         # 51.325 de 128.806 licitações preenchidas
      url_evidencia: licitacao.LINK_LICITACON_CIDADAO   # 100% preenchido; nível LICITAÇÃO, não item
    result_classification_map: {}   # PENDENTE: leiaute do eValidador (PDF 1.4 → 404)
    observed_codes:                 # contados no arquivo; SIGNIFICADO NÃO CONFIRMADO
      item.TP_RESULTADO_ITEM: {"": 670332, A: 336597, D: 32972, F: 21361, R: 3931, N: 1966}
      item.TP_RESULTADO_ITEM_com_homologado: {"": 116627, A: 335176, R: 265, N: 227}
      licitacao.CD_TIPO_FASE_ATUAL: {PUB: 93802, ADH: 25340, EPU: 6030, HAP: 3634}
      licitacao.TP_RESULTADO_GLOBAL: {"": 106309, A: 22069, F: 159, D: 121, R: 108, N: 40}
      item_prop.TP_RESULTADO_PROPOSTA: {C: 1585915, D: 1050375, "": 372665, P: 17082}
      item.TP_DOCUMENTO_vencedor_nos_homologados: {J: 326194, "": 123607, F: 2488, E: 1}
    personal_data: "pessoas.csv, memcomissao.csv, licitante.csv não são lidos; CPF (TP_DOCUMENTO=F) descartado"
    ready_for_price_import: false
  BPS:
    source_url: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/BPS/csv/2026_csv.zip
    snapshot: {bytes: 903596, sha256: 60ed6b06ca25f80bdfdea98ca598c0ab6ee4946f627f82613e0617c542c2b137,
               last_modified: "Tue, 20 Oct 2026 09:00:27 GMT"}
    json_snapshot: {url: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/BPS/json/2026_json.zip,
                    bytes: 1196477, sha256: e4c30f9e6ca262c7247a04a2cee9895a1583aa63cbdeb0ff4195da9d59363a0a,
                    note: "preços como número JSON (float) — não usado para dinheiro"}
    dictionary: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/BPS/Metadados_BPS_07_04_2026.pdf   # PENDENTE de leitura
    license: "não informada (license_id vazio, 20/10/2026)"
    archive_kind: zip_csv
    files: ["2026.csv"]             # 6.551.514 bytes, 10.609 linhas, 36 colunas
    csv_dialect: {delimiter: ";"}
    encoding: utf-8-sig
    number_format: ponto            # 5029.73, 1.0393 (até 4 casas)
    date_format: dd/mm/aaaa
    field_map:
      registro_id: co_seq_bps       # 10.609 distintos
      descricao: ds_item
      codigo_catalogo: co_catmat    # 1.859 distintos
      unidade: un_fornecimento      # COMPRIMIDO, FRASCO, AMPOLA, CÁPSULA...
      apresentacao: un_medida_capacidade   # "FRASCO 1,00 ML"
      quantidade: qt_medicamento
      valor_unitario: vl_preco_unitario    # × qt_medicamento = vl_preco_total em 100% das linhas
      valor_total: vl_preco_total
      orgao: no_instituicao (cnpj_instituicao)
      fornecedor: cnpj_fornecedor
      data: dt_compra               # 02/01/2026 a 28/09/2026
      processo: nu_processo_compra
    presentation_and_unit_map: "comparável só o mesmo co_catmat na mesma un_fornecimento"
    result_classification_map: {}   # PENDENTE: o arquivo não diz a etapa do preço
    observed_codes:
      tp_compra: {ADMINISTRATIVA: 10002, JUDICIAL: 607}
      modalidade: {Pregão: 7556, Registro de Preços: 2856, Dispensa de Licitação: 185, Leilão: 11, Diálogo Competitivo: 1}
      no_classe: {DROGAS E MEDICAMENTOS: 10609}
    url_per_record: false
    ready_for_price_import: false

# ###########################################################
#  GovDocs no VPS — aplicativo + proxy com TLS automático
#
#  Suba com:  docker compose up -d --build
#  Ver logs:  docker compose logs -f app
#  Derrube:   docker compose down
# ###########################################################

services:
  app:
    build:
      context: ..
      dockerfile: implantacao/Dockerfile
      # Preenchidos por `promover.sh` a partir da TAG em checkout. Sem
      # eles a imagem diz "desconhecido" — e diz, em vez de mentir.
      args:
        GOVDOCS_RELEASE: ${GOVDOCS_RELEASE:-desconhecida}
        GOVDOCS_COMMIT: ${GOVDOCS_COMMIT:-desconhecido}
    image: govdocs:local
    restart: unless-stopped

    # A PORTA NÃO É PUBLICADA NO HOST, e isso é a decisão de
    # segurança mais importante deste arquivo.
    #
    # Com `ports: "8501:8501"`, o Streamlit ficaria acessível em
    # http://<ip-do-vps>:8501 — sem TLS, sem o domínio, e
    # contornando o Caddy inteiro. Quem descobrisse o IP entraria
    # pela porta dos fundos em texto claro. Aqui só a rede interna
    # do compose alcança o app; a internet fala com o Caddy.
    expose:
      - "8501"

    # Os segredos vêm de um arquivo FORA do repositório, criado por
    # você no servidor. Nada de `environment:` com valor literal
    # aqui: este arquivo é versionado, e segredo em arquivo
    # versionado é segredo vazado.
    env_file:
      - /etc/govdocs/env

    # O runtime aprovado do WordCraft é um artefato de release separado do
    # código Python. O host o instala de forma atômica e o contentor recebe
    # somente leitura; nenhuma edição do navegador pode alterar JS/WASM ou os
    # avisos de licença admitidos pelo manifesto.
    volumes:
      - /opt/govdocs-wordcraft/wordcraft:/app/static/wordcraft:ro

    networks:
      - interna

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"     # HTTP/3
    # Arquivo PRÓPRIO, com uma variável só: `ACME_EMAIL`.
    #
    # Deliberadamente NÃO é o `/etc/govdocs/env` do app. Aquele tem as
    # chaves do Supabase e das IAs, e o Caddy não tem o que fazer com
    # elas — dar a um proxy o ambiente inteiro da aplicação é ampliar
    # o estrago de graça no dia em que ele for comprometido.
    env_file:
      - /etc/govdocs/caddy.env

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificados — PRECISA persistir
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - interna

  # #########################################################
  #  Gov Conect 2.0 (P06) — atrás do profile `govconect`.
  #
  #  `docker compose up -d` continua subindo SÓ o Streamlit e o Caddy,
  #  exatamente como antes. Os serviços novos só sobem com
  #  `docker compose --profile govconect up -d`, e o Caddy só os expõe
  #  com o `Caddyfile.govconect` (ver RUNBOOK_P06.md). Nenhum publica
  #  porta: a internet fala com o Caddy, o Caddy com o `web`, e o
  #  `web` (BFF) com a `api`. A `api` não é alcançável de fora.
  #
  #  Segredos por serviço, nunca o `/etc/govdocs/env` do Streamlit:
  #  ele tem a chave de SERVIDOR do Supabase, que a API não tem por
  #  desenho (ADR-002). `api.env` leva só a chave PUBLICÁVEL e a URL do
  #  Redis interno; `web.env`, a URL interna da API.
  # #########################################################
  web:
    profiles: ["govconect"]
    build:
      context: ..
      dockerfile: implantacao/Dockerfile.web
      args:
        # `:-` e não `:?`: o compose interpola TODOS os serviços, inclusive
        # os de profile desligado, e `:?` derrubaria o `up` do Streamlit.
        # Vazio, quem recusa é o `test -n` do Dockerfile.web.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
        GOVCONECT_RELEASE: ${GOVDOCS_RELEASE:-desconhecida}
    image: govconect-web:local
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - /etc/govdocs/web.env
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 512m
    stop_grace_period: 20s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - interna

  api:
    profiles: ["govconect"]
    build:
      context: ..
      dockerfile: implantacao/Dockerfile.api
      target: api
      args:
        GOVCONECT_RELEASE: ${GOVDOCS_RELEASE:-desconhecida}
        GOVCONECT_COMMIT: ${GOVDOCS_COMMIT:-desconhecido}
    image: govconect-api:local
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - /etc/govdocs/api.env
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 384m
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - interna

  worker:
    profiles: ["govconect"]
    build:
      context: ..
      dockerfile: implantacao/Dockerfile.api
      target: worker
      args:
        GOVCONECT_RELEASE: ${GOVDOCS_RELEASE:-desconhecida}
        GOVCONECT_COMMIT: ${GOVDOCS_COMMIT:-desconhecido}
    image: govconect-worker:local
    restart: unless-stopped
    # Sem porta nenhuma: só consome a fila.
    env_file:
      - /etc/govdocs/api.env
    read_only: true
    # LibreOffice converte em /tmp e grava o perfil no HOME (/tmp).
    tmpfs:
      - /tmp:size=512m
    mem_limit: 1g
    # Job em curso: o Celery termina o item atual (acks_late devolve o
    # aviso se não der); 60 s cobre um item de coleta ou um PDF comum.
    stop_grace_period: 60s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - interna

  redis:
    profiles: ["govconect"]
    # A mesma linha do CI (jobs api-rls e web-e2e).
    image: redis:7.4-alpine
    restart: unless-stopped
    # Broker e arquivo efêmero (relatório por 30 min), NUNCA fonte de
    # verdade: o job mora no Postgres (0031). `noeviction`: cheio, recusa
    # a escrita (o job falha com código) em vez de jogar fora um aviso de
    # fila em silêncio. Sem persistência em disco: reiniciar perde avisos
    # e arquivos, não jobs — o usuário pede de novo e o domínio retoma.
    # `protected-mode no`: sem senha, o modo protegido recusaria a API e o
    # worker (outros contentores). A proteção é a rede: porta não
    # publicada, só a `interna` alcança. Senha/ACL entra quando houver
    # gestão de segredo para ela (RUNBOOK_P06.md, pendências).
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction",
              "--save", "", "--appendonly", "no", "--protected-mode", "no"]
    expose:
      - "6379"
    read_only: true
    mem_limit: 320m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - interna

networks:
  interna:
    driver: bridge

volumes:
  # Sem este volume, cada `docker compose down` jogaria fora os
  # certificados e o Let's Encrypt seria consultado de novo na
  # subida seguinte — até bater o limite de emissão por domínio e
  # o site ficar sem HTTPS por uma semana. É o erro clássico de
  # quem põe Caddy em contentor.
  caddy_data:
  caddy_config:

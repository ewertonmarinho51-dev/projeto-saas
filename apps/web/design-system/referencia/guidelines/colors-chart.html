<!-- @dsCard group="Colors" viewport="700x120" name="Data visualization" subtitle="Series 1–5 + track; always labelled" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-card)}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}.sw .c{height:56px;border-radius:8px;border:1px solid rgba(23,36,58,.08)}.sw b{display:block;font:600 11px/1.3 var(--font-sans);margin-top:6px}.sw span{font:400 11px/1.3 var(--font-mono);color:var(--text-secondary)}</style></head><body><div class="sw"><div><div class="c" style="background:var(--chart-1)"></div><b>chart-1</b><span>blue 500</span></div><div><div class="c" style="background:var(--chart-2)"></div><b>chart-2</b><span>green 500</span></div><div><div class="c" style="background:var(--chart-3)"></div><b>chart-3</b><span>amber 500</span></div><div><div class="c" style="background:var(--chart-4)"></div><b>chart-4</b><span>violet 500</span></div><div><div class="c" style="background:var(--chart-5)"></div><b>chart-5</b><span>teal 500</span></div><div><div class="c" style="background:var(--chart-track)"></div><b>chart-track</b><span>gray 100</span></div></div></body></html>

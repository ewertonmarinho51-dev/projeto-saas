<!-- @dsCard group="Spacing" viewport="700x150" name="Elevation" subtitle="Restrained shadows — borders do most of the work" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-card)}body{background:var(--bg-app)}.r{display:flex;gap:18px}.r div{flex:1;height:84px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:12px;display:grid;place-items:center;font:400 11px/1.4 var(--font-mono);color:var(--text-secondary);text-align:center}</style></head><body><div class="r"><div>flat<br>cards, tables</div><div style="box-shadow:var(--shadow-xs)">shadow-xs<br>secondary btn</div><div style="box-shadow:var(--shadow-sm)">shadow-sm<br>elevated card</div><div style="box-shadow:var(--shadow-md)">shadow-md<br>menus, hover</div><div style="box-shadow:var(--shadow-lg)">shadow-lg<br>dialogs, toasts</div><div style="box-shadow:var(--focus-ring);border-color:var(--accent-brand)">focus-ring<br>3px blue 25%</div></div></body></html>

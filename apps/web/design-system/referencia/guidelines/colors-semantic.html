<!-- @dsCard group="Colors" viewport="700x190" name="Semantic" subtitle="fg / bg / border / solid for success, warning, error, info" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-card)}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.k{border-radius:10px;border:1px solid;padding:12px;display:grid;gap:8px}.k b{font:600 13px/1 var(--font-sans)}.k span{font:400 11px/1.4 var(--font-mono)}.dots{display:flex;gap:4px}.dots i{width:18px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.06)}</style></head><body><div class="g"><div class="k" style="background:var(--success-bg);border-color:var(--success-border);color:var(--success-fg)"><b>Sucesso</b><span>--success-fg<br>--success-bg<br>--success-border</span><div class="dots"><i style="background:var(--success-solid)"></i><i style="background:var(--success-fg)"></i><i style="background:var(--success-border)"></i><i style="background:var(--success-bg)"></i></div></div><div class="k" style="background:var(--warning-bg);border-color:var(--warning-border);color:var(--warning-fg)"><b>Atenção</b><span>--warning-fg<br>--warning-bg<br>--warning-border</span><div class="dots"><i style="background:var(--warning-solid)"></i><i style="background:var(--warning-fg)"></i><i style="background:var(--warning-border)"></i><i style="background:var(--warning-bg)"></i></div></div><div class="k" style="background:var(--error-bg);border-color:var(--error-border);color:var(--error-fg)"><b>Erro</b><span>--error-fg<br>--error-bg<br>--error-border</span><div class="dots"><i style="background:var(--error-solid)"></i><i style="background:var(--error-fg)"></i><i style="background:var(--error-border)"></i><i style="background:var(--error-bg)"></i></div></div><div class="k" style="background:var(--info-bg);border-color:var(--info-border);color:var(--info-fg)"><b>Informação</b><span>--info-fg<br>--info-bg<br>--info-border</span><div class="dots"><i style="background:var(--info-solid)"></i><i style="background:var(--info-fg)"></i><i style="background:var(--info-border)"></i><i style="background:var(--info-bg)"></i></div></div></div></body></html>

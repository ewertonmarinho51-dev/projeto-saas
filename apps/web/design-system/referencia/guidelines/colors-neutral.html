<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--surface-card)}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}.sw .c{height:56px;border-radius:8px;border:1px solid rgba(23,36,58,.08)}.sw b{display:block;font:600 11px/1.3 var(--font-sans);margin-top:6px}.sw span{font:400 11px/1.3 var(--font-mono);color:var(--text-secondary)}</style></head><body><div class="sw"><div><div class="c" style="background:var(--gc-gray-0)"></div><b>gc-gray-0</b><span>#FFFFFF</span></div><div><div class="c" style="background:var(--gc-gray-25)"></div><b>gc-gray-25</b><span>#F6F8FC</span></div><div><div class="c" style="background:var(--gc-gray-50)"></div><b>gc-gray-50</b><span>#F0F3F8</span></div><div><div class="c" style="background:var(--gc-gray-100)"></div><b>gc-gray-100</b><span>#E6EBF2</span></div><div><div class="c" style="background:var(--gc-gray-200)"></div><b>gc-gray-200</b><span>#D7DEE8</span></div><div><div class="c" style="background:var(--gc-gray-300)"></div><b>gc-gray-300</b><span>#BAC4D2</span></div><div><div class="c" style="background:var(--gc-gray-400)"></div><b>gc-gray-400</b><span>#7A8699</span></div><div><div class="c" style="background:var(--gc-gray-500)"></div><b>gc-gray-500</b><span>#5B687C</span></div><div><div class="c" style="background:var(--gc-gray-600)"></div><b>gc-gray-600</b><span>#435069</span></div><div><div class="c" style="background:var(--gc-gray-700)"></div><b>gc-gray-700</b><span>#2C3950</span></div><div><div class="c" style="background:var(--gc-gray-800)"></div><b>gc-gray-800</b><span>#17243A</span></div><div><div class="c" style="background:var(--gc-gray-900)"></div><b>gc-gray-900</b><span>#0C1526</span></div></div></body></html>

<!-- @dsCard group="Gov Conect App" viewport="1440x900" name="Gov Conect — web app" subtitle="Click-through: login, início, processos, novo processo (DFD), cotação (triagem → mapa → relatório), GovBot" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gov Conect</title>
<link rel="icon" href="../../assets/favicon-32.png"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0}.gc-proc-row:hover{background:var(--surface-hover)}.kit-3col{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;gap:20px;align-items:start}.kit-aside{display:grid;gap:16px;position:sticky;top:0}.kit-2col{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}.kit-form2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.kit-bot{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;flex:1;min-height:0}.kit-bot__list{border-right:1px solid var(--border-subtle);background:var(--surface-card);padding:16px 12px;overflow-y:auto}.kit-bot__main{display:flex;flex-direction:column;min-width:0;min-height:0}.kit-bot__head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 24px;border-bottom:1px solid var(--border-subtle);background:var(--surface-card)}.kit-bot__thread{flex:1;overflow-y:auto;padding:24px;display:grid;align-content:start;gap:22px;max-width:860px;width:100%;margin:0 auto}.kit-bot__composer{padding:12px 24px 20px;max-width:860px;width:100%;margin:0 auto}.kit-bot__sources{border-left:1px solid var(--border-subtle);background:var(--surface-card);padding:16px;overflow-y:auto;display:grid;align-content:start;gap:12px}@media (max-width:1280px){.kit-bot{grid-template-columns:240px minmax(0,1fr)}.kit-bot__sources{display:none}}@media (max-width:900px){.kit-bot{grid-template-columns:minmax(0,1fr)}.kit-bot__list{display:none}}@media (max-width:1280px){.kit-govbot{position:absolute;right:0;top:0;bottom:0;z-index:20;box-shadow:var(--shadow-lg)}}@media (max-width:1240px){.kit-3col{grid-template-columns:240px minmax(0,1fr)}.kit-aside{grid-column:1/-1;position:static;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}}@media (max-width:980px){.kit-3col,.kit-2col{grid-template-columns:minmax(0,1fr)}.kit-form2{grid-template-columns:1fr}}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="GovBotPanel.jsx"></script>
<script type="text/babel" src="LoginScreen.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="ProcessesScreen.jsx"></script>
<script type="text/babel" src="NewProcessScreen.jsx"></script>
<script type="text/babel" src="PriceStages.jsx"></script>
<script type="text/babel" src="PriceResearchScreen.jsx"></script>
<script type="text/babel" src="GovBotScreen.jsx"></script>
<script type="text/babel">
const { Toast, ToastStack } = window.GovConectDesignSystem_76359c;
const CRUMBS = { inicio: [{ label: "Início" }], processos: [{ label: "Processos" }], novo: [{ label: "Processos", href: "#processos" }, { label: "Novo processo" }], cotacoes: [{ label: "Cotações" }], cotacao: [{ label: "Cotações", href: "#cotacoes" }, { label: "Materiais de expediente" }], govbot: [{ label: "GovBot" }, { label: "Requisitos do ETP de computadores" }] };
function App() {
  const [auth, setAuth] = React.useState(() => localStorage.getItem("gc-kit-auth") === "1");
  const [route, setRoute] = React.useState(() => localStorage.getItem("gc-kit-route") || "inicio");
  const [bot, setBot] = React.useState(false);
  const [toast, setToast] = React.useState(null);
  const go = (r) => { const rr = r === "cotacoes" ? "cotacao" : ["inicio", "processos", "novo", "cotacao", "govbot"].includes(r) ? r : "inicio"; setRoute(rr); localStorage.setItem("gc-kit-route", rr); };
  const showToast = (title, description) => { setToast({ title, description }); setTimeout(() => setToast(null), 4000); };
  if (!auth) return <LoginScreen onLogin={() => { setAuth(true); localStorage.setItem("gc-kit-auth", "1"); }} />;
  const Screen = { inicio: HomeScreen, processos: ProcessesScreen, novo: NewProcessScreen, cotacao: PriceResearchScreen, govbot: GovBotScreen }[route];
  return <>
    <AppShell bleed={route === "govbot"} route={route} go={go} crumbs={CRUMBS[route]} govbotOpen={bot} onGovBot={() => setBot(!bot)} onLogout={() => { setAuth(false); localStorage.removeItem("gc-kit-auth"); }}><Screen key={route} go={go} toast={showToast} /></AppShell>
    {toast && <ToastStack><Toast title={toast.title} description={toast.description} onClose={() => setToast(null)} /></ToastStack>}
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>

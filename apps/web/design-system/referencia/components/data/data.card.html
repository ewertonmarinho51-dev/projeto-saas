<!-- @dsCard group="Components" viewport="700x620" name="Data" subtitle="KpiCard, DataTable, Pagination, BarChart" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--bg-app)}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.col{display:grid;gap:14px}.lbl{font:600 11px/1 var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:-4px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}</style>
</head><body><div id="root"></div><script type="text/babel">
const NS = window.GovConectDesignSystem_76359c;
const { KpiCard, DataTable, TableContainer, Pagination, BarChart, Card, Badge, StatusBadge, IconButton } = NS;
const rows=[{id:1,n:"01",d:"Papel A4 branco 75 g/m²",s:"Caixa c/ 10 resmas",u:"CX",q:120,p:229.9,st:"concluido"},{id:2,n:"02",d:"Caneta esferográfica azul",s:"Ponta média 1,0 mm",u:"UN",q:600,p:1.35,st:"concluido"},{id:3,n:"03",d:"Pasta arquivo A-Z lombo largo",u:"UN",q:80,p:18.4,st:"em_revisao"},{id:4,n:"04",d:"Grampeador de mesa 26/6",u:"UN",q:25,p:42.1,st:"pendente"}];
const brl=(n)=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
function App(){const [sel,setSel]=React.useState([1]);const [sort,setSort]=React.useState({key:"p",dir:"desc"});const [pg,setPg]=React.useState(1);
const sorted=[...rows].sort((a,b)=>(sort.dir==="asc"?1:-1)*(a[sort.key]>b[sort.key]?1:-1));
return <div className="col">
<div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12}}>
<KpiCard label="Processos ativos" value="24" icon="briefcase" delta="+12% neste mês" footnote="Em andamento no órgão" />
<KpiCard label="Valor estimado" value="R$ 59,6" unit="mil" trend={[12,18,16,24,30,34,41,59]} footnote="Cotações concluídas" />
<KpiCard label="Itens com pendência" value="3" icon="warning-circle" delta="2 discrepâncias" deltaTone="warning" />
</div>
<Card flush divided title="Itens da pesquisa" subtitle="Preço estimado por item" actions={<Badge variant="brand">4 itens</Badge>} footer={<div style={{width:"100%"}}><Pagination page={pg} total={48} onChange={setPg} /></div>}>
<div style={{overflowX:"auto"}}><DataTable compact selectable selected={sel} onSelect={setSel} sort={sort} onSort={setSort} rows={sorted} columns={[{key:"n",label:"Nº",width:40,render:r=><span className="gc-mono" style={{color:"var(--text-secondary)"}}>{r.n}</span>},{key:"d",label:"Descrição",sortable:true,render:r=><>{r.d}{r.s&&<span className="gc-table__sub">{r.s}</span>}</>},{key:"u",label:"Un."},{key:"q",label:"Qtd.",align:"right",sortable:true},{key:"p",label:"Preço estimado",align:"right",sortable:true,render:r=>brl(r.p)},{key:"st",label:"Situação",render:r=><StatusBadge status={r.st} size="sm" />},{key:"a",label:"",width:40,render:()=><IconButton size="sm" icon="dots-three-vertical" label="Mais ações" />}]} /></div>
</Card>
<Card title="Comparativo entre fontes" subtitle="Preço unitário médio por fonte (dados ilustrativos)"><BarChart data={[{label:"PNCP",value:3890},{label:"Compras.gov.br",value:4250},{label:"Painel de Preços",value:4320},{label:"Pesquisa direta",value:4400}]} /></Card>
</div>}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>

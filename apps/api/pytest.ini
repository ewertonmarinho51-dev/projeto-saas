# Raiz própria: a suíte da API roda de dentro de apps/api, sem carregar
# o conftest do app Streamlit nem precisar das dependências dele.
#
# `../..` no caminho é a raiz do repositório, de onde a API importa os
# módulos PUROS de `src/` (hoje `src.processos`). O Streamlit não entra:
# `tests/test_sem_streamlit.py` prova.
[pytest]
testpaths = tests
pythonpath = . ../..
addopts = -p no:cacheprovider
